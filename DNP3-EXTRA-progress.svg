  <text x="60" y="109" font-size="40" font-weight="750" fill="#f1f8f9">From OpenDNP3 to DNP3-EXTRA</text>
  <text x="60" y="138" font-size="17" fill="#a5bdc7">Selected RTU Device Profile + minimum security addendum / IEEE 1815-2012</text>

  <!-- Baseline history track -->
  <rect x="60" y="160" width="1164" height="70" rx="16" fill="#131f28" stroke="#28414d"/>
