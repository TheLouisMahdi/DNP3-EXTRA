<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="545" viewBox="0 0 1280 545" role="img" aria-labelledby="title desc">
<title id="title">DNP3-EXTRA implementation progress</title>
<desc id="desc">The upstream OpenDNP3 3.1.2 repository is the zero baseline for custom development. Four of four recent Core RTU Host source slices are landed, but zero of those four have matching Windows acceptance evidence recorded for the current source snapshot. There are 119 tracked requirements; overall completion is pending a consolidated audit. Group 70 is tracked separately.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101b23"/>
    <stop offset=".56" stop-color="#0a131b"/>
    <stop offset="1" stop-color="#111922"/>
  </linearGradient>
  <linearGradient id="completed" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#55e5aa"/>
    <stop offset="1" stop-color="#28b9c1"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4cd8a9"/>
    <stop offset="1" stop-color="#42bcd5"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" stroke="#29404d" stroke-opacity=".20" fill="none" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>
<rect x="1" y="1" width="1278" height="543" rx="26" fill="url(#background)" stroke="#29404b" stroke-width="2"/>
<rect x="2" y="2" width="1276" height="541" rx="25" fill="url(#grid)" opacity=".55"/>

<g font-family="Segoe UI, Inter, Arial, sans-serif">
