  <rect x="770" y="464" width="454" height="38" rx="10" fill="#282e2a" stroke="#5f6347"/>
  <text x="997" y="488" text-anchor="middle" font-size="15" font-weight="650" fill="#e4d19b">OVERALL COMPLETION: AUDIT PENDING</text>

  <text x="60" y="518" font-size="13" fill="#708e9c">G70 is tracked separately. Source presence is not a compliance or runtime verification claim.</text>
