  <text x="94" y="190" font-family="Consolas, monospace" font-size="11" letter-spacing=".9" fill="#a8b8c2">ZERO / CUSTOM DEVELOPMENT</text>
  <text x="94" y="207" font-size="17" font-weight="700" fill="#f1f8f9">OpenDNP3 3.1.2</text>

  <path d="M333 195 H880" fill="none" stroke="#3f7f81" stroke-width="2" stroke-dasharray="6 9"/>
  <path d="M865 188L880 195L865 202" fill="none" stroke="#62d7bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="507" y="182" font-family="Consolas, monospace" font-size="13" fill="#80bdb5" letter-spacing="1">CUSTOM IMPLEMENTATION</text>

  <rect x="898" y="173" width="308" height="43" rx="12" fill="#14362f" stroke="#397f6c"/>
