<rect x="646.00" y="384" width="285.00" height="26" rx="8" fill="#1a2a34" stroke="#62737c" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="939.00" y="384" width="285.00" height="26" rx="8" fill="#1a2a34" stroke="#62737c" stroke-width="1.2" stroke-dasharray="5 5"/>

  <text x="60" y="438" font-size="15" fill="#9ab5c0">These bars cover only the four recent Core RTU Host slices, not all project requirements.</text>

