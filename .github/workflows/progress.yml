name: Requirements progress

on:
  push:
    branches: [develop]
    paths:
      - 'DNP3_PDD_PLAN/**'
      - 'opendnp3/**'
      - 'apps/**'
      - 'cli/**'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/progress.py'
      - '.github/workflows/progress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirements-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate and regenerate
        run: |
          python3 scripts/progress.py
          python3 scripts/progress.py --check
          git diff --check
      - name: Update generated files
        run: |
          git add -- README.md DNP3_PDD_PLAN/progress-ieee.svg DNP3_PDD_PLAN/progress-profile.svg DNP3_PDD_PLAN/progress-security.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'docs: refresh requirements progress dashboard'
          if ! git push origin HEAD:develop; then
            echo '::error::Dashboard push failed. Run python scripts/progress.py and python scripts/progress.py --check locally, then submit the generated diff using the repository branch policy.'
            exit 1
          fi
